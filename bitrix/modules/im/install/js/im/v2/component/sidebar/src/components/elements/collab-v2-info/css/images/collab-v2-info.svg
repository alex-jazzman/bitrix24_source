<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 294 214" preserveAspectRatio="none" fill="none">
	<rect width="294" height="214" fill="white"/>

	<g id="animated-elements">
		<circle cx="10" cy="10" r="10" fill="#eeeff0"/>
		<rect x="30" y="4" width="190" height="8" rx="2" fill="#eeeff0"/>
		<rect x="30" y="32" width="250" height="8" rx="2" fill="#eeeff0"/>
		<rect x="30" y="48" width="230" height="8" rx="2" fill="#eeeff0"/>
		<rect x="30" y="64" width="178" height="8" rx="2" fill="#eeeff0"/>
		<rect x="30" y="84" width="60" height="8" rx="2" fill="#eeeff0"/>
		<rect x="30" y="116" width="42" height="6" rx="2" fill="#eeeff0"/>
		<rect x="30" y="133" width="180" height="8" rx="2" fill="#eeeff0"/>
		<rect x="30" y="169" width="30" height="6" rx="2" fill="#eeeff0"/>
		<rect x="30" y="184" width="70" height="22" rx="8" fill="#eeeff0"/>
		<rect x="106" y="184" width="82" height="22" rx="8" fill="#eeeff0"/>
		<rect x="194" y="184" width="54" height="22" rx="8" fill="#eeeff0"/>
	</g>

	<rect id="shimmer" width="294" height="214" fill="url(#shimmer-gradient)" mask="url(#skeleton-mask)"/>

	<mask id="skeleton-mask" fill="white">
		<use xlink:href="#animated-elements"/>
	</mask>

	<linearGradient x1="66.6%" y1="50%" x2="33.3%" y2="50%" id="shimmer-gradient">
		<stop stop-color="#000000" stop-opacity="0" offset="0%"/>
		<stop stop-color="#000000" stop-opacity="0.07" offset="50%"/>
		<stop stop-color="#000000" stop-opacity="0" offset="100%"/>
	</linearGradient>

	<animate xlink:href="#shimmer" attributeName="x" from="-294" to="294" dur="1s" begin="0s" repeatCount="indefinite"/>
</svg>
